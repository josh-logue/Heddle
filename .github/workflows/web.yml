# Checks the web version (lint, type check, unit tests, build) and publishes it to
# GitHub Pages at https://josh-logue.github.io/Heddle/.
# Runs only when the web app, its workflow or the demo boards it bundles change.
# Deploys from main and, while the port is under way, from the web branch. The Pages
# environment must allow the web branch (Settings > Environments > github-pages).
name: Web

on:
  push:
    branches: [main, web]
    paths:
      - "web/**"
      - "examples/*.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "examples/*.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # The desktop shell's Electron isn't needed here (its tests run on Windows, W9f).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser tests (Chromium and WebKit)
        run: |
          npx playwright install --with-deps chromium webkit firefox
          npx playwright test --project=chromium --project=webkit

      - name: Offline (the built site, with its service worker)
        run: npx playwright test -c playwright.offline.config.ts

      # Not yet run against the app anywhere else (it won't start on the development
      # machine): reported, but not blocking, until it has passed here.
      - name: Browser tests (Firefox)
        continue-on-error: true
        run: npx playwright test --project=firefox

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
