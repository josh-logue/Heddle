# Builds the desktop app (web/desktop, Electron) on Windows: the one-click installer and the
# portable zip, unsigned. Pushing a tag such as v0.2.0 (it must match web/package.json's
# version) also makes a draft GitHub Release with both; publish it by hand. Run by hand from
# the Actions tab, it only keeps them as the run's artifacts.
name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # (the release draft)

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (with Electron)
        run: npm ci

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match web/package.json ($version)"
            exit 1
          fi

      - name: Lint, type check, unit tests
        run: npm run lint && npm run typecheck && npm test

      - name: The packaged app's tests (builds the site and the unpacked app)
        run: npm run test:packaged

      - name: Installer and portable zip
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: heddle-windows
          path: |
            web/release/*.exe
            web/release/*.zip
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" --draft --title "Heddle $GITHUB_REF_NAME" --generate-notes \
            "release/Heddle Setup $version.exe" "release/Heddle-$version-win.zip"
